# Пример отдельного локального vhost для PWA.
# Не используйте subpath /deebot/: PWA ожидает корень сайта.
server {
    listen 443 ssl;
    server_name deebot.home.arpa;

    # Укажите ваши существующие локальные сертификаты.
    ssl_certificate     /etc/ssl/local/deebot.home.arpa.crt;
    ssl_certificate_key /etc/ssl/local/deebot.home.arpa.key;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
